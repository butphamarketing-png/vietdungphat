<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Công ty TNHH Kiến trúc Xây dựng Việt Dũng Phát — thiết kế, xây dựng và cải tạo nhà ở tại TP.HCM. 20 năm kinh nghiệm, báo giá minh bạch."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Việt Dũng Phát — Atelier kiến trúc & nội thất</title>
    <link rel="preload" href="/hero.mp4?v=client" as="video" type="video/mp4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400;1,6..96,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      document.addEventListener("error", function (e) {
        const el = e.target;
        if (!el || el.tagName !== "IMG" || el.dataset.cmsRetry) return;
        const src = el.currentSrc || el.src || "";
        if (!/vietdungphat\.com/i.test(src) || /images\.weserv\.nl/i.test(src)) return;
        el.dataset.cmsRetry = "1";
        el.src = "https://images.weserv.nl/?url=" + encodeURIComponent(src.replace(/^https?:\/\//i, ""));
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
