<!doctype html>
<html lang="vi">
  <head>
    <title>Việt Dũng Phát — Atelier kiến trúc & nội thất</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="1HqcBe-fRgoXXvSZM5ATw6Jdo2wi2rgeCTkcKk3asZM" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Công ty TNHH Kiến trúc Xây dựng Việt Dũng Phát — thiết kế, xây dựng và cải tạo nhà ở tại TP.HCM. 20 năm kinh nghiệm, báo giá minh bạch."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preload" href="/hero.mp4?v=client" as="video" type="video/mp4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      document.addEventListener("error", function (e) {
        const el = e.target;
        if (!el || el.tagName !== "IMG") return;
        const src = el.currentSrc || el.src || "";
        if (!el.dataset.cmsRetry && /vietdungphat\.com/i.test(src) && !/images\.weserv\.nl/i.test(src)) {
          el.dataset.cmsRetry = "1";
          el.src =
            "https://images.weserv.nl/?url=" +
            encodeURIComponent(src.replace(/^https?:\/\//i, "")) +
            "&default=" +
            encodeURIComponent("www.vietdungphat.com/studio/01.jpg");
          return;
        }
        if (el.dataset.ph !== "1" && !/\/studio\/01\.jpg/i.test(src)) {
          el.dataset.ph = "1";
          el.src = "/studio/01.jpg";
        }
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
