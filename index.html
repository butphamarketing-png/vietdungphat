<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Việt Dũng Phát — Atelier kiến trúc & nội thất</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400;1,6..96,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #314f5c;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #app-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-loader-mark {
        position: relative;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
      }
      .app-loader-mark::before {
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.18);
        border-top-color: #fff;
        animation: loader-spin 0.9s linear infinite;
      }
      .app-loader-mark img {
        width: 72px;
        height: auto;
        animation: loader-pulse 1.4s ease-in-out infinite;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes loader-pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.72; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      body.is-loading { overflow: hidden; }
    </style>
  </head>
  <body class="is-loading">
    <script>
      document.addEventListener("error", function (e) {
        const el = e.target;
        if (!el || el.tagName !== "IMG" || el.dataset.cmsRetry) return;
        const src = el.currentSrc || el.src || "";
        if (!/vietdungphat\.com/i.test(src) || /images\.weserv\.nl/i.test(src)) return;
        el.dataset.cmsRetry = "1";
        el.src = "https://images.weserv.nl/?url=" + encodeURIComponent(src.replace(/^https?:\/\//i, ""));
      }, true);
    </script>
    <div id="app-loader" aria-label="Đang tải">
      <div class="app-loader-mark">
        <img src="/logo.png" alt="Việt Dũng Phát" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
