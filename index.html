      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background: #fff;
        overflow: hidden;
        transition: opacity 0.65s ease, visibility 0.65s ease;
      }
      .boot-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-loader-pattern {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .boot-loader-houses {
        --r: 158px;
        position: absolute;
        width: min(78vw, 380px);
        height: min(78vw, 380px);
        pointer-events: none;
      }
      @media (max-width: 520px) {
        .boot-loader-houses { --r: 40vw; }
        .boot-loader-houses svg { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
      }
      .boot-loader-houses svg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        color: #c9a84c;
        animation: boot-house-breathe 2.6s ease-in-out infinite;
      }
      .boot-loader-houses svg:nth-child(1) { transform: rotate(0deg) translateY(calc(var(--r) * -1)) rotate(0deg); animation-delay: 0s; }
      .boot-loader-houses svg:nth-child(2) { transform: rotate(45deg) translateY(calc(var(--r) * -1)) rotate(-45deg); animation-delay: .18s; }
      .boot-loader-houses svg:nth-child(3) { transform: rotate(90deg) translateY(calc(var(--r) * -1)) rotate(-90deg); animation-delay: .36s; }
      .boot-loader-houses svg:nth-child(4) { transform: rotate(135deg) translateY(calc(var(--r) * -1)) rotate(-135deg); animation-delay: .54s; }
      .boot-loader-houses svg:nth-child(5) { transform: rotate(180deg) translateY(calc(var(--r) * -1)) rotate(-180deg); animation-delay: .72s; }
      .boot-loader-houses svg:nth-child(6) { transform: rotate(225deg) translateY(calc(var(--r) * -1)) rotate(-225deg); animation-delay: .9s; }
      .boot-loader-houses svg:nth-child(7) { transform: rotate(270deg) translateY(calc(var(--r) * -1)) rotate(-270deg); animation-delay: 1.08s; }
      .boot-loader-houses svg:nth-child(8) { transform: rotate(315deg) translateY(calc(var(--r) * -1)) rotate(-315deg); animation-delay: 1.26s; }
      .boot-loader-inner {
        position: relative;
        z-index: 1;
        width: 122px;
        height: 122px;
        display: grid;
        place-items: center;
      }
      .boot-loader-inner::before {
        content: "";
        position: absolute;
        inset: -22px;
        background: radial-gradient(circle, #fff 70%, rgba(255,255,255,0) 100%);
      }
      .boot-loader-ring {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(201, 168, 76, 0.28);
        border-top-color: #c9a84c;
        border-radius: 50%;
        animation: boot-spin 1s linear infinite;
      }
      .boot-loader img {
        position: relative;
        z-index: 1;
        width: 74px;
        height: 74px;
        object-fit: contain;
        background: #c9a84c;
        padding: 10px;
        border-radius: 16px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.88; }
      }
      @keyframes boot-house-breathe {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      body.is-booting { overflow: hidden; }
    </style>

    <script>
      document.addEventListener("error", function (e) {
        const el = e.target;
        if (!el || el.tagName !== "IMG") return;
        const src = el.currentSrc || el.src || "";
        if (!el.dataset.cmsRetry && /vietdungphat\.com/i.test(src) && !/images\.weserv\.nl/i.test(src)) {
          el.dataset.cmsRetry = "1";
          el.src =
            "https://images.weserv.nl/?url=" +
            encodeURIComponent(src.replace(/^https?:\/\//i, "")) +
            "&default=" +
            encodeURIComponent("www.vietdungphat.com/studio/01.jpg");
          return;
        }
        if (el.dataset.ph !== "1" && !/\/studio\/01\.jpg/i.test(src)) {
          el.dataset.ph = "1";
          el.src = "/studio/01.jpg";
        }
      }, true);
    </script>
